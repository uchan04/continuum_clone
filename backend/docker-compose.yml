version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: continuum-postgres
    environment:
      POSTGRES_DB: continuum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - continuum-network

  redis:
    image: redis:7-alpine
    container_name: continuum-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - continuum-network

  continuum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: continuum-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: continuum
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY:-changeme-32-byte-secret-key-here}
      JWT_SECRET: ${JWT_SECRET:-changeme-jwt-secret-at-least-64-bytes-long}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      HR_MANAGER_EMAIL: ${HR_MANAGER_EMAIL:-hr@company.com}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    networks:
      - continuum-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  continuum-network:
    driver: bridge
